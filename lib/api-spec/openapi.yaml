          type: string

    EngineeringTask:
      type: object
      required:
        - id
        - featureRequestId
        - title
        - description
        - status
        - createdAt
        - updatedAt
      properties:
        id:
          type: integer
        featureRequestId:
          type: integer
        title:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [backlog, todo, in_progress, in_review, done, cancelled]
        assigneeUserId:
          type: ["string", "null"]
        assigneeName:
          type: ["string", "null"]
        assigneeEmail:
          type: ["string", "null"]
        githubRepo:
          type: ["string", "null"]
        githubBranch:
          type: ["string", "null"]
        githubPrNumber:
          type: ["integer", "null"]
        githubPrUrl:
          type: ["string", "null"]
        githubPrState:
          type: ["string", "null"]
        githubPrStateUpdatedAt:
          type: ["string", "null"]
          format: date-time
        createdByUserId:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    EngineeringTaskInput:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: string
        status:
          type: string
          enum: [backlog, todo, in_progress, in_review, done, cancelled]
        assigneeUserId:
          type: ["string", "null"]

    EngineeringTaskUpdate:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: string
        status:
          type: string
          enum: [backlog, todo, in_progress, in_review, done, cancelled]
        assigneeUserId:
          type: ["string", "null"]
        githubRepo:
          type: ["string", "null"]
        githubBranch:
          type: ["string", "null"]
        githubPrNumber:
          type: ["integer", "null"]
        githubPrUrl:
          type: ["string", "null"]

    EngineeringTaskMessage:
      type: object
      required: [id, taskId, role, content, createdAt]
